name: Reproducible visual proof
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run demo:verify
        env:
          PROOF_OUT: evidence/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-proof-${{ github.sha }}
          path: evidence/ci
          if-no-files-found: warn
